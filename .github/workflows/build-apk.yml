name: Build NotasPlus APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleRelease
      - name: Stage APK temporarily
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NotasPlus-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NotasPlus-APK
          path: dist/NotasPlus-v1.0.apk
          retention-days: 7
      - name: Publish APK temporarily to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/NotasPlus-v1.0.apk
          git commit -m "chore: stage Notas+ APK for private storage seed" || exit 0
          git push
